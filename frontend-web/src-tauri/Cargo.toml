[package]
name = "cinevault"
version = "0.0.0"
description = "CineVault desktop (Tauri)"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-ico"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
