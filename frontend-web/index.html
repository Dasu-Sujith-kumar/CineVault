<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>CineVault - Personal Movie Library</title>
    <meta name="description" content="Your personal movie and TV show hosting library" />
    <meta name="author" content="CineVault" />

    <meta property="og:title" content="CineVault - Personal Movie Library" />
    <meta property="og:description" content="Your personal movie and TV show hosting library" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <style>
      html.cinevault-player-transparent,
      body.cinevault-player-transparent,
      body.cinevault-player-transparent #root {
        background: transparent !important;
      }
    </style>
    <script>
      if (window.location.hash.startsWith("#/player")) {
        document.documentElement.classList.add("cinevault-player-transparent");
        document.documentElement.style.background = "transparent";
        window.addEventListener(
          "DOMContentLoaded",
          () => {
            document.body.classList.add("cinevault-player-transparent");
            document.body.style.background = "transparent";
          },
          { once: true },
        );
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
